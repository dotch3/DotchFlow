# DotchFlow API Specification
# Created by: dotch3 (GitHub)
# Version: 1.0.0
#
# This file is the single source of truth for the API spec. src/index.js
# loads it directly (js-yaml) and serves it at /api-docs, only overriding
# `servers` at runtime (actual PORT locally, + the Render URL when
# deployed - both can't be known ahead of time in a static file). Every
# other field here - info, paths, components, security - is exactly what
# gets served, and is also what a direct import (Postman/Insomnia/codegen)
# would read.
---
openapi: 3.0.3
info:
  title: DotchFlow API
  description: |
    RESTful API for DotchFlow - Personal finance manager with gamification.
    
    ## Authentication
    Most endpoints require JWT authentication. To get a token:
    1. Login at `/auth/login` to receive the token
    2. Add the header `Authorization: Bearer <YOUR_TOKEN>` to all authenticated requests
    
    ## Response Structure
    - **Success**: `{ "data": ... }` or `{ "resource": ... }`
    - **Error**: `{ "error": "error message" }` or `{ "errors": [...] }`

    ## Language / Internationalization
    Error messages, validation messages, and the store catalog are
    translated (en / es / pt-BR). The language is picked in this order:
    1. Logged in: uses the language saved on the account (`PUT /auth/language`).
    2. Not logged in: uses the `Accept-Language` request header - sent
       automatically by browsers, which is why Swagger UI's "Try it out"
       can respond in your browser's language even though you never chose it.
    3. Neither present: falls back to English.

    For deterministic responses (scripts, automated tests), send
    `Accept-Language: en` explicitly rather than relying on the fallback.
  version: 1.1.0
  contact:
    name: dotch3
    url: https://github.com/dotch3
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  # Overridden at runtime by src/index.js (real PORT locally, Render URL
  # when deployed) - this static value only matters for a direct file
  # import (Postman/Insomnia). Update it if your default PORT changes.
  - url: http://localhost:3001
    description: Local development server
  # The production (Render) URL is injected automatically at runtime
  # from RENDER_EXTERNAL_URL - see src/index.js.

tags:
  - name: Auth
    description: User authentication and registration
  - name: Transactions
    description: Financial transaction management
  - name: Categories
    description: Transaction categories
  - name: Goals
    description: Financial goals
  - name: Finance
    description: Financial analysis and forecasts
  - name: Gamification
    description: XP, levels and achievements system
  - name: Store
    description: Customization store
  - name: Admin
    description: Administrative endpoints

paths:
  # =============================================================================
  # HEALTH CHECK (Public - No Auth Required)
  # =============================================================================
  /health:
    get:
      summary: API health check
      description: |
        Returns the API status and version information.
        This endpoint does not require authentication.
        
        **Use cases:**
        - Monitor API availability
        - Health checks for load balancers
        - Integration testing
      tags:
        - Health
      security: []
      responses:
        '200':
          description: API is running correctly
          content:
            application/json:
              example:
                status: ok
                app: DotchFlow API
                version: 1.1.0

  # =============================================================================
  # AUTH - Authentication
  # =============================================================================
  /auth/register:
    post:
      summary: Register new user
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  description: User email
                password:
                  type: string
                  minLength: 6
                  description: Password (minimum 6 characters)
            example:
              email: user@example.com
              password: myPassword123
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              example:
                token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                user:
                  id: 1
                  email: user@example.com
                  xp_points: 0
                  dotch_coins: 0
                  level: 1
                  streak_count: 0
        '400':
          description: Invalid data
          content:
            application/json:
              example:
                errors:
                  - msg: Invalid email
                    param: email
                    location: body
        '409':
          description: Email already registered
          content:
            application/json:
              example:
                error: Email already registered
        '403':
          description: User limit reached
          content:
            application/json:
              example:
                error: Maximum user limit (50) reached

  /auth/login:
    post:
      summary: User login
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
            example:
              email: test@dotchflow.com
              password: myPassword123
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              example:
                token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                user:
                  id: 1
                  email: user@example.com
                  xp_points: 1250
                  dotch_coins: 250
                  level: 3
                  streak_count: 5
        '400':
          description: Invalid data
          content:
            application/json:
              example:
                errors:
                  - msg: Invalid email
                    param: email
        '401':
          description: Invalid credentials
          content:
            application/json:
              example:
                error: Invalid credentials

  /auth/me:
    get:
      summary: Get current user data
      tags:
        - Auth
      security:
        - BearerAuth: []
      responses:
        '401':
          description: Authentication token missing or invalid
          content:
            application/json:
              example:
                error: Authentication token missing
        '200':
          description: User data
          content:
            application/json:
              example:
                user:
                  id: 1
                  email: user@example.com
                  language: en
                  xp_points: 1250
                  dotch_coins: 250
                  level: 3
                  streak_count: 5
                  last_checkin: "2024-01-15"
                  created_at: "2024-01-01T00:00:00.000Z"
        '404':
          description: User not found
          content:
            application/json:
              example:
                error: User not found

  /auth/language:
    put:
      summary: Update user language preference
      tags:
        - Auth
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - language
              properties:
                language:
                  type: string
                  enum: [en, es, pt-BR]
                  description: Language code
            example:
              language: en
      responses:
        '401':
          description: Authentication token missing or invalid
          content:
            application/json:
              example:
                error: Authentication token missing
        '200':
          description: Language updated
          content:
            application/json:
              example:
                user:
                  id: 1
                  email: user@example.com
                  language: en
                  xp_points: 1250
                  dotch_coins: 250
                  level: 3
        '400':
          description: Invalid language
          content:
            application/json:
              example:
                  error: "Invalid language. Allowed values: en, es, pt-BR"

  # =============================================================================
  # TRANSACTIONS
  # =============================================================================
  /transactions:
    get:
      summary: List user transactions
      tags:
        - Transactions
      security:
        - BearerAuth: []
      parameters:
        - name: category_id
          in: query
          schema:
            type: integer
          description: Filter by category
        - name: type
          in: query
          schema:
            type: string
            enum: [income, expense]
          description: Filter by type
        - name: start_date
          in: query
          schema:
            type: string
            format: date
          description: Start date (YYYY-MM-DD)
        - name: end_date
          in: query
          schema:
            type: string
            format: date
          description: End date (YYYY-MM-DD)
        - name: search
          in: query
          schema:
            type: string
          description: Search in description
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
          description: Result limit
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
          description: Pagination offset
      responses:
        '401':
          description: Authentication token missing or invalid
          content:
            application/json:
              example:
                error: Authentication token missing
        '200':
          description: Transaction list
          content:
            application/json:
              example:
                transactions:
                  - id: 1
                    user_id: 1
                    amount: 150.00
                    description: Grocery store
                    category_id: 1
                    category_name: Food
                    category_icon: 🍔
                    date: 2024-01-15
                    type: expense
                    is_quick_entry: false
                    is_recurring: false
                    created_at: 2024-01-15T10:30:00.000Z
                totals:
                  income: 5000.00
                  expense: 2350.00
                balance: 2650.00

    post:
      summary: Create new transaction
      tags:
        - Transactions
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - amount
                - type
              properties:
                amount:
                  type: number
                  minimum: 0.01
                  description: Transaction amount
                type:
                  type: string
                  enum: [income, expense]
                  description: Transaction type
                description:
                  type: string
                  description: Optional description
                category_id:
                  type: integer
                  description: Category ID
                date:
                  type: string
                  format: date
                  description: Date (YYYY-MM-DD), default is today
                is_quick_entry:
                  type: boolean
                  description: Quick entry
                is_recurring:
                  type: boolean
                  description: Recurring transaction
            example:
              amount: 89.90
              type: expense
              description: Pharmacy
              category_id: 4
              date: 2024-01-15
              is_recurring: false
      responses:
        '401':
          description: Authentication token missing or invalid
          content:
            application/json:
              example:
                error: Authentication token missing
        '201':
          description: Transaction created
          content:
            application/json:
              example:
                transaction:
                  id: 15
                  user_id: 1
                  amount: 89.90
                  description: Pharmacy
                  category_id: 4
                  category_name: Health
                  category_icon: 💊
                  date: 2024-01-15
                  type: expense
                  is_quick_entry: false
                  is_recurring: false
                xp_gained: 10
        '400':
          description: Invalid data
          content:
            application/json:
              example:
                errors:
                  - msg: Amount must be positive
                    param: amount
                    value: -50

  /transactions/{id}:
    put:
      summary: Update transaction
      tags:
        - Transactions
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Transaction ID
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                amount:
                  type: number
                description:
                  type: string
                category_id:
                  type: integer
                date:
                  type: string
                  format: date
                type:
                  type: string
                  enum: [income, expense]
                is_recurring:
                  type: boolean
            example:
              amount: 120.00
              description: Grocery store (updated)
      responses:
        '401':
          description: Authentication token missing or invalid
          content:
            application/json:
              example:
                error: Authentication token missing
        '200':
          description: Transaction updated
          content:
            application/json:
              example:
                transaction:
                  id: 1
                  amount: 120.00
                  description: Grocery store (updated)
        '404':
          description: Transaction not found
          content:
            application/json:
              example:
                error: Transaction not found

    delete:
      summary: Delete transaction
      tags:
        - Transactions
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '401':
          description: Authentication token missing or invalid
          content:
            application/json:
              example:
                error: Authentication token missing
        '200':
          description: Transaction deleted
          content:
            application/json:
              example:
                success: true
        '404':
          description: Transaction not found
          content:
            application/json:
              example:
                error: Transaction not found

  # =============================================================================
  # CATEGORIES
  # =============================================================================
  /categories:
    get:
      summary: List user categories
      tags:
        - Categories
      security:
        - BearerAuth: []
      responses:
        '401':
          description: Authentication token missing or invalid
          content:
            application/json:
              example:
                error: Authentication token missing
        '200':
          description: Category list
          content:
            application/json:
              example:
                categories:
                  - id: 1
                    user_id: 1
                    name: Food
                    icon: 🍔
                    monthly_limit: 0
                    monthly_spent: 450.00
                    usage_percent: 0
                  - id: 2
                    user_id: 1
                    name: Transport
                    icon: 🚗
                    monthly_limit: 500
                    monthly_spent: 320.00
                    usage_percent: 64

    post:
      summary: Create new category
      tags:
        - Categories
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  description: Category name
                icon:
                  type: string
                  description: "Emoji icon (default: 📁)"
                monthly_limit:
                  type: number
                  description: "Monthly limit (default: 0)"
            example:
              name: Subscriptions
              icon: 📱
              monthly_limit: 200
      responses:
        '401':
          description: Authentication token missing or invalid
          content:
            application/json:
              example:
                error: Authentication token missing
        '201':
          description: Category created
          content:
            application/json:
              example:
                category:
                  id: 10
                  user_id: 1
                  name: Subscriptions
                  icon: 📱
                  monthly_limit: 200
        '400':
          description: Name required
          content:
            application/json:
              example:
                error: Name is required

  /categories/{id}:
    put:
      summary: Update category
      tags:
        - Categories
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                icon:
                  type: string
                monthly_limit:
                  type: number
            example:
              name: Subscriptions and Services
              icon: 💳
              monthly_limit: 250
      responses:
        '401':
          description: Authentication token missing or invalid
          content:
            application/json:
              example:
                error: Authentication token missing
        '200':
          description: Category updated
          content:
            application/json:
              example:
                category:
                  id: 10
                  name: Subscriptions and Services
                  icon: 💳
                  monthly_limit: 250
        '404':
          description: Category not found
          content:
            application/json:
              example:
                error: Category not found

    delete:
      summary: Delete category
      tags:
        - Categories
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '401':
          description: Authentication token missing or invalid
          content:
            application/json:
              example:
                error: Authentication token missing
        '200':
          description: Category deleted
          content:
            application/json:
              example:
                success: true
        '404':
          description: Category not found
          content:
            application/json:
              example:
                error: Category not found

  # =============================================================================
  # GOALS
  # =============================================================================
  /goals:
    get:
      summary: List financial goals
      tags:
        - Goals
      security:
        - BearerAuth: []
      responses:
        '401':
          description: Authentication token missing or invalid
          content:
            application/json:
              example:
                error: Authentication token missing
        '200':
          description: Goal list
          content:
            application/json:
              example:
                goals:
                  - id: 1
                    user_id: 1
                    name: Trip to Disney
                    target_amount: 15000
                    current_amount: 4500
                    deadline: 2024-12-31
                    status: in_progress
                    remaining: 10500
                    progress_percent: 30
                    monthly_needed: 875
                  - id: 2
                    user_id: 1
                    name: New Car
                    target_amount: 80000
                    current_amount: 80000
                    deadline: 2025-06-01
                    status: completed
                    remaining: 0
                    progress_percent: 100

    post:
      summary: Create new goal
      tags:
        - Goals
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - target_amount
              properties:
                name:
                  type: string
                  description: Goal name
                target_amount:
                  type: number
                  description: Target amount
                deadline:
                  type: string
                  format: date
                  description: Deadline (YYYY-MM-DD), optional
            example:
              name: Own Home
              target_amount: 100000
              deadline: 2026-01-01
      responses:
        '401':
          description: Authentication token missing or invalid
          content:
            application/json:
              example:
                error: Authentication token missing
        '201':
          description: Goal created
          content:
            application/json:
              example:
                goal:
                  id: 5
                  name: Own Home
                  target_amount: 100000
                  current_amount: 0
                  deadline: 2026-01-01
                  status: in_progress
        '400':
          description: Invalid data
          content:
            application/json:
              example:
                error: Name and target amount are required

  /goals/{id}/deposit:
    post:
      summary: Deposit to a goal
      tags:
        - Goals
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - amount
              properties:
                amount:
                  type: number
                  minimum: 0.01
            example:
              amount: 500
      responses:
        '401':
          description: Authentication token missing or invalid
          content:
            application/json:
              example:
                error: Authentication token missing
        '200':
          description: Deposit successful
          content:
            application/json:
              example:
                goal:
                  id: 1
                  current_amount: 5000
                  status: in_progress
                xp_gained: 0
                completed: false
        '400':
          description: Invalid amount
          content:
            application/json:
              example:
                error: Invalid amount
        '404':
          description: Goal not found
          content:
            application/json:
              example:
                error: Goal not found

  /goals/{id}:
    delete:
      summary: Delete goal
      tags:
        - Goals
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '401':
          description: Authentication token missing or invalid
          content:
            application/json:
              example:
                error: Authentication token missing
        '200':
          description: Goal deleted
          content:
            application/json:
              example:
                success: true
        '404':
          description: Goal not found
          content:
            application/json:
              example:
                error: Goal not found

  # =============================================================================
  # FINANCE - Financial Analysis
  # =============================================================================
  /finance/health:
    get:
      summary: Financial health (50-15-35 rule)
      tags:
        - Finance
      security:
        - BearerAuth: []
      parameters:
        - name: year
          in: query
          schema:
            type: integer
          description: "Year (default: current year)"
        - name: month
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 12
          description: "Month (default: current month)"
      responses:
        '401':
          description: Authentication token missing or invalid
          content:
            application/json:
              example:
                error: Authentication token missing
        '200':
          description: Financial health analysis
          content:
            application/json:
              example:
                period: "2024-01"
                balance: 2650.00
                total_income: 5000.00
                total_expense: 2350.00
                breakdown:
                  essential:
                    amount: 1200
                    percent: "24.0"
                    ideal: 50
                  priority:
                    amount: 800
                    percent: "16.0"
                    ideal: 15
                  lifestyle:
                    amount: 350
                    percent: "7.0"
                    ideal: 35
                health_score: 72
                score_label: Good 🟡

  /finance/forecast:
    get:
      summary: 30-day financial forecast
      tags:
        - Finance
      security:
        - BearerAuth: []
      responses:
        '401':
          description: Authentication token missing or invalid
          content:
            application/json:
              example:
                error: Authentication token missing
        '200':
          description: Monthly forecast
          content:
            application/json:
              example:
                current_balance: 2650.00
                projected_end_of_month: 1890.50
                daily_trend: 25.32
                forecast:
                  - date: "2024-01-16"
                    balance: 2675.32
                  - date: "2024-01-17"
                    balance: 2700.64

  # =============================================================================
  # GAMIFICATION
  # =============================================================================
  /gamification/checkin:
    post:
      summary: Daily check-in (earn XP)
      tags:
        - Gamification
      security:
        - BearerAuth: []
      responses:
        '401':
          description: Authentication token missing or invalid
          content:
            application/json:
              example:
                error: Authentication token missing
        '200':
          description: Check-in done
          content:
            application/json:
              example:
                success: true
                xp_gained: 175
                coins_gained: 15
                streak_count: 6
                xp_points: 675
                dotch_coins: 265
                level: 2
                leveled_up: false
                message: 6 days in a row! Bonus applied!
        '400':
          description: Already checked in today
          content:
            application/json:
              example:
                error: Already checked in today!
                next_checkin: "2024-01-16 23:59:59"

  /gamification/status:
    get:
      summary: Get gamification status
      tags:
        - Gamification
      security:
        - BearerAuth: []
      responses:
        '401':
          description: Authentication token missing or invalid
          content:
            application/json:
              example:
                error: Authentication token missing
        '200':
          description: User gamification data
          content:
            application/json:
              example:
                id: 1
                level: 3
                xp_points: 1250
                dotch_coins: 250
                streak_count: 5
                last_checkin: "2024-01-15"
                xp_progress: 250
                xp_to_next_level: 500
                xp_percent: 50
                checked_in_today: false

  # =============================================================================
  # STORE
  # =============================================================================
  /store:
    get:
      summary: List store items
      tags:
        - Store
      security:
        - BearerAuth: []
      responses:
        '401':
          description: Authentication token missing or invalid
          content:
            application/json:
              example:
                error: Authentication token missing
        '200':
          description: Available items
          content:
            application/json:
              example:
                items:
                  - id: 1
                    item_name: Dark Theme Premium
                    description: Exclusive dark theme for the app
                    icon: 🌙
                    cost_in_coins: 100
                    required_level: 1
                    is_premium: 0
                    translation_key: dark_theme
                    unlocked: false
                    can_afford: true
                    meets_level: true
                dotch_coins: 250
                level: 3
              # item_name/description are already translated to the
              # requester's language (Accept-Language header, or the
              # logged-in user's saved `language` preference) - English
              # shown here is just this example's default.

  /store/unlock:
    post:
      summary: Unlock/purchase item
      tags:
        - Store
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - store_item_id
              properties:
                store_item_id:
                  type: integer
                  description: Store item ID to unlock
            example:
              store_item_id: 1
      responses:
        '401':
          description: Authentication token missing or invalid
          content:
            application/json:
              example:
                error: Authentication token missing
        '200':
          description: Purchase successful
          content:
            application/json:
              example:
                success: true
                item_unlocked: Dark Theme Premium
                coins_spent: 100
                dotch_coins_remaining: 150
        '400':
          description: Item required
          content:
            application/json:
              example:
                error: Item is required
        '404':
          description: Item not found
          content:
            application/json:
              example:
                error: Item not found
        '409':
          description: Already unlocked
          content:
            application/json:
              example:
                error: Item already unlocked
        '403':
          description: Insufficient level or coins
          content:
            application/json:
              example:
                error: Insufficient DotchCoins

  # =============================================================================
  # ADMIN
  # =============================================================================
  /admin/status:
    get:
      summary: Get database statistics and configuration
      description: |
        Returns current database statistics including:
        - Number of users, transactions, categories, goals, store items
        - Cleanup configuration (interval, last cleanup date)
        - Whether cleanup is needed based on schedule
        
        **Note:** Response language is determined by the authenticated user's language preference.
      tags:
        - Admin
      security:
        - BearerAuth: []
      responses:
        '200':
          description: System status retrieved successfully
          content:
            application/json:
              example:
                stats:
                  users: 1
                  transactions: 16
                  categories: 9
                  goals: 3
                  store_items: 6
                config:
                  max_users: 50
                  cleanup_interval_days: 30
                cleanup:
                  last_cleanup: "2024-01-15T10:00:00.000Z"
                  next_cleanup: "2024-02-14T10:00:00.000Z"
                  cleanup_needed: false
        '401':
          description: Authentication token missing or invalid
          content:
            application/json:
              example:
                error: Authentication token missing

  /admin/cleanup:
    post:
      summary: Trigger database cleanup
      description: |
        Removes old data and orphaned records from the database:
        
        **Behavior:**
        - Deletes transactions older than `CLEANUP_INTERVAL_DAYS` (default: 30 days)
        - Always keeps the 100 most recent transactions regardless of age
        - Removes categories, goals, and store unlocks belonging to deleted users
        
        **Use cases:**
        - Scheduled maintenance (configure via cron job or external scheduler)
        - Manual cleanup before data export
        - Before database migration or backup
      tags:
        - Admin
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Cleanup completed successfully
          content:
            application/json:
              example:
                success: true
                message: Database cleanup completed successfully
                deleted:
                  transactions: 15
                  orphaned_categories: 0
                  orphaned_goals: 0
                  orphaned_unlocks: 0
                last_cleanup: "2024-01-15T10:00:00.000Z"
                next_cleanup_in_days: 30
        '401':
          description: Authentication token missing or invalid
          content:
            application/json:
              example:
                error: Authentication token missing
        '500':
          description: Internal server error during cleanup
          content:
            application/json:
              example:
                error: Error during cleanup

  /admin/reset:
    post:
      summary: Reset database to initial state
      description: |
        Deletes all user data while preserving system configuration.
        
        **Behavior:**
        - Deletes ALL users, transactions, categories, goals, and store unlocks
        - Preserves `gamification_store` items (store catalog)
        - Resets cleanup metadata
        
        **Warning:** This action is irreversible!
        
        **Query Parameters:**
        - `keepUsers=true` - Only delete user data, preserve user accounts
      tags:
        - Admin
      security:
        - BearerAuth: []
      parameters:
        - name: keepUsers
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: "If true, preserves user accounts (only deletes their data)"
      responses:
        '200':
          description: Database reset completed successfully
          content:
            application/json:
              example:
                success: true
                message: Database reset completed successfully
                deleted:
                  users_deleted: all
                  users_preserved: 0
                  transactions_deleted: true
                  categories_deleted: true
                  goals_deleted: true
                  unlocks_deleted: true
                system_data_preserved:
                  - gamification_store
        '401':
          description: Authentication token missing or invalid
          content:
            application/json:
              example:
                error: Authentication token missing
        '500':
          description: Internal server error during reset
          content:
            application/json:
              example:
                error: Error resetting database

  /admin/seed:
    post:
      summary: Seed test data for development
      description: |
        Creates a test user with sample data for development and testing.
        
        **Creates:**
        - Test user account (test@dotchflow.com / myPassword123)
        - 9 default expense and income categories
        - 16 sample transactions spanning last 30 days
        - 3 financial goals with progress
        - 2 unlocked store items
        
        **Initial user stats:**
        - Level 3, 500 XP, 250 DotchCoins, 5-day streak
        
        **Note:** Fails if test user already exists. Use `/admin/reset` first if needed.
      tags:
        - Admin
      security:
        - BearerAuth: []
      responses:
        '201':
          description: Test data seeded successfully
          content:
            application/json:
              example:
                success: true
                message: Test data seeded successfully
                user:
                  email: test@dotchflow.com
                  password: myPassword123
                  xp_points: 1250
                  dotch_coins: 250
                  level: 3
                  streak_count: 5
                seeded:
                  categories: 9
                  transactions: 16
                  goals: 3
                  unlocks: 2
        '401':
          description: Authentication token missing or invalid
          content:
            application/json:
              example:
                error: Authentication token missing
        '409':
          description: Test user already exists
          content:
            application/json:
              example:
                error: Test user already exists
                message: "User test@dotchflow.com already exists. Use /admin/reset first."
        '500':
          description: Internal server error during seeding
          content:
            application/json:
              example:
                error: Error seeding test data

