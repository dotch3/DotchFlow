server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback - same purpose as frontend/vercel.json's rewrite:
    # let React Router handle client-side routes instead of 404ing on
    # direct load/refresh of e.g. /login.
    location / {
        try_files $uri /index.html;
    }
}
